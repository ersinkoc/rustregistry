[package]
name = "registry-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
default-run = "rustregistry"

[[bin]]
name = "rustregistry"
path = "src/main.rs"

[target.'cfg(windows)'.dependencies]
gpui = "=0.2.2"
gpui-component = "=0.5.1"
registry-core = { path = "../registry-core" }
dirs = "6"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde.workspace = true
serde_json.workspace = true

[target.'cfg(windows)'.dev-dependencies]
gpui = { version = "=0.2.2", features = ["test-support"] }
tempfile = "3"
uuid.workspace = true
windows-sys = { version = "0.61", features = ["Win32_System_Registry"] }
winreg = { version = "0.56", default-features = false }

[build-dependencies]
embed-resource = "3"
