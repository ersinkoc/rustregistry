[package]
name = "registry-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Windows registry inventory, conservative diagnostics, and protected startup recovery"

[dependencies]
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
sha2 = "0.10"
flate2 = "=1.1.11"

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
winreg = { version = "0.56", default-features = false, features = ["transactions"] }
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_System_Services", "Win32_System_SystemInformation", "Win32_Security"] }

[[bin]]
name = "registry-scan"
path = "src/bin/registry-scan.rs"
