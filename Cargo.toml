[workspace]
members = ["crates/registry-core", "src-tauri"]
default-members = ["crates/registry-core"]
resolver = "2"

[workspace.package]
version = "0.1.24"
edition = "2021"
rust-version = "1.93"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
