[workspace]
members = ["crates/registry-core", "crates/registry-desktop", "src-tauri"]
default-members = ["crates/registry-core"]
resolver = "2"

[workspace.package]
version = "0.3.1"
edition = "2021"
rust-version = "1.93"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }

# Preserve overflow checks when generic dependency code is instantiated downstream.
[profile.release]
overflow-checks = true
