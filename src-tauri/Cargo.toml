[package]
name = "rustregistry"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Windows registry health explorer with protected startup recovery"
default-run = "rustregistry-webview"

[[bin]]
name = "rustregistry-webview"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
registry-core = { path = "../crates/registry-core" }
uuid.workspace = true
