name: Bug report
description: Report an incorrect result, crash, or desktop behavior.
body:
  - type: input
    id: version
    attributes:
      label: RustRegistry and Windows versions
      placeholder: RustRegistry 0.3.0, Windows 11 x64
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the screen, action, and registry category if relevant. Use a disposable fixture for changes.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
      description: Include error text or a screenshot with private paths, commands, and registry data redacted.
    validations:
      required: true
